set_output_state:
  name: Set output state
  description: Set a Hydros output state to off, on, auto, or a raw numeric value. Provide either entity_id or thing_id/output_key.
  fields:
    entity_id:
      name: Output entity
      description: Hydros switch/number entity to target.
      required: false
      selector:
        entity:
          integration: hydros
          domain:
            - switch
            - number
    thing_id:
      name: Thing ID
      description: Hydros collective/thing identifier.
      required: false
      selector:
        text:
    output_key:
      name: Output key
      description: Hydros output name/key.
      required: false
      selector:
        text:
    state:
      name: State
      description: Output state (off, on, auto) or an integer value.
      required: true
      example: on
      selector:
        text:

set_pump_speed:
  name: Set pump speed
  description: Set variable pump output speed percentage. Provide either entity_id or thing_id/output_key.
  fields:
    entity_id:
      name: Pump entity
      description: Hydros pump number entity to target.
      required: false
      selector:
        entity:
          integration: hydros
          domain: number
    thing_id:
      name: Thing ID
      required: false
      selector:
        text:
    output_key:
      name: Output key
      required: false
      selector:
        text:
    percent:
      name: Percent
      description: Pump speed percent from 0 to 100.
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: box

change_mode:
  name: Change mode
  description: Change Hydros collective mode, for example Feeding or Normal. Provide either entity_id or thing_id.
  fields:
    entity_id:
      name: Mode entity
      description: Hydros mode select entity to target.
      required: false
      selector:
        entity:
          integration: hydros
          domain: select
    thing_id:
      name: Thing ID
      required: false
      selector:
        text:
    mode:
      name: Mode
      description: Target mode name exactly as defined in Hydros.
      required: true
      example: Feeding
      selector:
        text:

manual_dose:
  name: Manual dose
  description: Dose a target amount in ml by turning a doser output on for a computed duration. Provide either entity_id or thing_id/output_key.
  fields:
    entity_id:
      name: Doser entity
      description: Hydros doser switch entity to target.
      required: false
      selector:
        entity:
          integration: hydros
          domain: switch
    thing_id:
      name: Thing ID
      required: false
      selector:
        text:
    output_key:
      name: Output key
      description: Doser output name/key.
      required: false
      selector:
        text:
    amount_ml:
      name: Amount (ml)
      description: Dose amount in milliliters.
      required: true
      selector:
        number:
          min: 0.01
          max: 1000
          step: 0.01
          mode: box

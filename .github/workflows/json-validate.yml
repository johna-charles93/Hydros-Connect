name: Validate JSON

# Guards against shipping a syntactically invalid manifest.json / hacs.json /
# translations file — HACS reads these from the release tag and a trailing
# comma breaks "add repository" for every user (see issue #5).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate every JSON file in the repo
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            if python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"; then
              echo "ok  $f"
            else
              echo "::error file=$f::Invalid JSON"
              fail=1
            fi
          done < <(find . -path ./.git -prune -o -name '*.json' -print0)
          exit $fail
